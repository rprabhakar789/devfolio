name: Agent CI

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'content/**'
      - 'scripts/**'
      - 'docs/portfolio-agent-knowledge-base.md'
      - '.github/workflows/agent-ci.yml'
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate:content

      - name: Test pipeline
        run: npm test
